name: 功能建议
description: 提议一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的实际场景，而不是直接描述方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 如果涉及 API 变化，请给出你设想的调用方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它方案
